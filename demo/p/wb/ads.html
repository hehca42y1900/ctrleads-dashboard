<script>/* CTRLeads демо: без сервера, данные вымышленные */
(function(){
var FIX = Date.UTC(2026, 9, 23, 6, 0, 0), RD = Date;
class DemoDate extends RD { constructor(...a){ if (a.length) super(...a); else super(FIX); } static now(){ return FIX; } }
window.Date = DemoDate;
var JK = 'ctrDemoJournal.v1', J0 = {"dates": [{"date": "2026-10-20", "comments": {"i1": "Поставка 120 шт в Хоругвино", "general": "Заказали отчёт «Аналитика категорий» за 28 дней"}}, {"date": "2026-10-18", "comments": {"i2": "Ставка 12 → 14 ₽"}}, {"date": "2026-10-14", "comments": {"general": "Старт осенней акции на пледы (−7%)", "i1": "Цена 1490 → 1390 ₽ в акции"}}, {"date": "2026-10-07", "comments": {"i3": "Новые фото в карточке, обложка 3:4"}}, {"date": "2026-10-01", "comments": {"general": "Себестоимость обновлена с 01.09 (+4%)"}}], "products": [{"id": "general", "sku": "", "name": "Общий комментарий"}, {"id": "i1", "sku": "NH-PLD-150", "name": "Плед флисовый 150×200, графит"}, {"id": "i2", "sku": "NH-TWL-W3", "name": "Полотенца вафельные 45×70, набор 3 шт"}, {"id": "i3", "sku": "NH-BED-15", "name": "Комплект постельного белья 1,5-сп., сатин"}]};
function jget(){ try{ var s = localStorage.getItem(JK); if (s) return JSON.parse(s); }catch(e){} return JSON.parse(JSON.stringify(J0)); }
function jset(j){ try{ localStorage.setItem(JK, JSON.stringify(j)); }catch(e){} }
function japply(j, op){
  var k = op.op || 'comment';
  function day(d){ var x = j.dates.find(function(r){ return r.date === d; });
    if (!x){ x = {date: d, comments: {}}; j.dates.push(x); j.dates.sort(function(a,b){ return b.date.localeCompare(a.date); }); } return x; }
  if (k === 'comment'){ var it = op.item || op.product, t = String(op.text || '').trim();
    if (t) day(op.date).comments[it] = t; else { var x = j.dates.find(function(r){ return r.date === op.date; }); if (x) delete x.comments[it]; } }
  else if (k === 'date') day(op.date);
  else if (k === 'delete_date') j.dates = j.dates.filter(function(r){ return r.date !== op.date; });
  else if (k === 'item'){ if (op.id === 'general') return; var p = j.products.find(function(r){ return r.id === op.id; });
    if (p){ p.sku = op.sku || ''; p.name = op.name || ''; } else j.products.push({id: op.id, sku: op.sku || '', name: op.name || ''}); }
  else if (k === 'delete_item'){ j.products = j.products.filter(function(r){ return r.id !== op.id; });
    j.dates.forEach(function(r){ delete r.comments[op.id]; }); }
}
window.__demoToast = function(text){
  try{ var d = document.getElementById('demoToast');
    if (!d){ d = document.createElement('div'); d.id = 'demoToast';
      d.style.cssText = 'position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:9999;max-width:min(92vw,520px);'
        + 'background:#1D1D23;color:#F5F5FA;border:1px solid #7B61FF;border-radius:10px;padding:10px 14px;font:13px/1.4 Inter,Arial,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.35)';
      document.body.appendChild(d); }
    d.textContent = text; d.style.display = 'block'; clearTimeout(d._t); d._t = setTimeout(function(){ d.style.display = 'none'; }, 4200);
  }catch(e){}
};
function resp(obj, status){ return Promise.resolve(new Response(JSON.stringify(obj), {status: status || 200, headers: {'Content-Type': 'application/json'}})); }
var END = '2026-10-22', PRESETS = [1, 7, 14, 30];
function days(a, b){ return Math.round((RD.parse(b + 'T00:00:00Z') - RD.parse(a + 'T00:00:00Z')) / 864e5) + 1; }
function preset(q){
  var n = days(q.get('from'), q.get('to')), best = PRESETS.reduce(function(a, p){ return Math.abs(p - n) < Math.abs(a - n) ? p : a; }, 7);
  var exact = q.get('to') === END && best === n;
  if (exact && q.get('cto')){ var c1 = new RD(RD.parse(q.get('from') + 'T00:00:00Z') - n * 864e5).toISOString().slice(0, 10);
    exact = q.get('cfrom') === c1 && days(q.get('cfrom'), q.get('cto')) === n; }
  if (!exact) __demoToast('В демо данные есть за «Вчера», 7, 14 и 30 дней до 22.10.2026 — показан ближайший период (' + best + ' дн.).');
  return best;
}
window.__demoXlsx = function(qs){ var q = new URLSearchParams(qs); return 'x/wb/rnp-' + preset(q) + '.xlsx'; };
var realFetch = window.fetch;
window.fetch = function(u, o){
  var s = String(u && u.url || u), m = (o && o.method || 'GET').toUpperCase();
  if (s.indexOf('/api/') !== 0) return realFetch.apply(this, arguments);
  var path = s.split('?')[0], q = new URLSearchParams(s.split('?')[1] || '');
  if (path === '/api/comments'){
    var j = jget();
    if (m === 'POST'){ var b = {}; try{ b = JSON.parse(o.body || '{}'); }catch(e){}
      (b.ops || [b]).forEach(function(op){ japply(j, op); }); jset(j); return resp({ok: true, state: j}); }
    return resp(j);
  }
  var A = window.__DEMO_API;
  if (path === '/api/rnp' && A) return resp(A.rnp[preset(q) + '-' + (q.get('group') || 'sku') + '-' + (q.get('all') || '0')]);
  if (path === '/api/dash' && A) return resp(A.dash[String(preset(q))]);
  if (path === '/api/note') return resp({ok: true});
  __demoToast('Это демо: загрузка файлов и сохранение на сервер отключены — данные уже заполнены.');
  return resp({error: 'демо: загрузка отключена'}, 400);
};
})();

<style>
:root{

          </tbody></table></div>
          <p class="bnote">${RBAD.some(Boolean)?`<b style="color:var(--clay)">РНП за ${DATA.days.filter((_,i)=>RBAD[i]).map(fdt).join(', ')} ещё не догрузился (заказов почти нет) — итоги «весь артикул» и сравнение с прошлым периодом посчитаны без этих дней.</b> `:''}Итог — сумма за ${DAYS.length} дн., под ним динамика к ${PL} (зелёный — лучше, красный — хуже; доли — в п.п.). «·» — РК в этот день не крутилась. ✎ — в этот день было изменение (наведите на дату).</p>
          <div class="drrbox"><span class="t">ДРР за неделю<br>расход ${rub(t.spend)} / заказы на ${rub(t.rev)}${HAS_AS?'<br>по прямым '+pf(t.ddrr):''}</span><span class="big ${drrCls(t.drr)}">${t.drr==null?'—':pf(t.drr,2)}</span></div>
        </div>
        <div class="cblock"><p class="blabel">Сравнение со средним по кабинету</p>
          ${bench('CTR',t.ctr,T.ctr,v=>pf(v,2),Math.max(t.ctr||0,T.ctr)*1.6,true)}
          ${bench('CPC',t.cpc,T.cpc,v=>rub(v,2),Math.max(t.cpc||0,T.cpc)*1.6,false)}
          ${bench('CR',t.cr,T.cr,v=>pf(v,2),Math.max(t.cr||0,T.cr)*1.6,true)}
          ${bench('ДРР',t.drr,TARGET,v=>pf(v),Math.max(t.drr||0,T.drr)*1.4,false)}
          <p class="bnote">Черта — среднее по кабинету (для ДРР — цель 5%). Зелёная точка — лучше среднего, красная — хуже.</p></div>
        ${R?`<div class="cblock"><p class="blabel">Товар целиком — остатки и цена</p>
          <div class="mrow"><span class="k">Выкуп, %</span><span class="v">${R.buyout==null?'—':nf(R.buyout,0)+'%'}</span><span class="d"></span></div>
          <div class="mrow"><span class="k">Остаток FBO / в пути</span><span class="v ${R.days!=null&&R.days<7?'bad':R.days!=null&&R.days<14?'warn':''}">${nf(R.stock)} / ${nf(R.transit)}</span><span class="d">${R.days==null?'':'хватит ~'+nf(R.days,0)+' дн.'}</span></div>
          <div class="mrow"><span class="k">Цена после СПП</span><span class="v">${rub(R.price)}</span><span class="d">СПП ${R.spp==null?'—':nf(R.spp,0)+'%'}</span></div>
          ${R.notes.length?`<p class="blabel" style="margin-top:12px">Журнал изменений (✎ на графиках)</p>${R.notes.map(n=>`<div class="mrow" style="grid-template-columns:52px 1fr"><span class="k mono">${fdt(n.d)}</span><span style="font-size:14px">${n.t}</span></div>`).join('')}`:''}
          <p class="bnote">Ответственный: ${R.resp}</p></div>`:''}
        <div class="cblock"><p class="blabel">По дням · слева реклама этой кампании, справа товар целиком (РНП)</p>
          <div class="ch2"><div><h5 style="color:var(--glaze)">Реклама РК</h5><div class="chart"></div><div class="chart"></div><div class="chart"></div></div>
          <div><h5 style="color:var(--clay)">Весь артикул</h5>${R?'<div class="chart"></div><div class="chart"></div><div class="chart"></div>':'<p class="bnote">Артикула нет в РНП за эту неделю.</p>'}</div></div></div>
        ${c.assoc.length?`<div class="cblock sib"><p class="blabel">Ассоциированные заказы — другие товары с этой рекламы</p><div class="tbl"><table><thead><tr><th>Товар</th><th class="num">Корзины</th><th class="num">Заказы</th><th class="num">Сумма</th></tr></thead><tbody>
          ${c.assoc.slice(0,8).map(x=>`<tr><td class="name" style="min-width:0">${x.name}<br><span style="color:var(--muted);font-size:12.5px">арт. WB ${x.nm} · ${x.vendor} · ${x.subject}</span></td><td class="num">${nf(x.cart)}</td><td class="num">${nf(x.ord)}</td><td class="num">${rub(x.rev)}</td></tr>`).join('')}
          ${c.assoc.length>8?`<tr><td class="name" style="min-width:0;color:var(--muted)">ещё ${c.assoc.length-8} товаров</td><td class="num">${nf(sum(c.assoc.slice(8).map(x=>x.cart)))}</td><td class="num">${nf(sum(c.assoc.slice(8).map(x=>x.ord)))}</td><td class="num">${rub(sum(c.assoc.slice(8).map(x=>x.rev)))}</td></tr>`:''}
          </tbody></table></div><p class="bnote">${pf(div(t.arev,t.rev),0)} суммы заказов этой кампании — другие товары. ДРР кампании посчитан по всем заказам, как в кабинете.</p></div>`:''}
        ${sib}
        <div class="cblock ctodo"><p class="blabel">Что сделать</p><ol>${(a.cs.length>1&&j===0?artHead(a):[]).concat(campAdvice(c,a)).map(x=>`<li>${x}</li>`).join('')}</ol></div>
      </div>`;
    L.appendChild(col);
    const [g1,g2,g3,g4,g5,g6]=col.querySelectorAll('.chart'), MK=DAYS.map((_,i)=>noteOn(R,i).join('; ')), CO={h:150,w:330,marks:MK};
    bars(g1,'Заказы с РК, шт',DAYS.map((_,i)=>act(i)?d(i).ord:null),fOrd,{...CO,min:1.7});
    bars(g2,'Расход РК, ₽',DAYS.map((_,i)=>act(i)?d(i).spend:null),fRub,CO);
    bars(g3,'ДРР РК, %',DAYS.map((_,i)=>{if(!act(i))return null;const x=d(i);return x.spend&&!x.rev?Infinity:div(x.spend,x.rev)}),fDrr,{...CO,ref:TARGET,cap:0.3,color:drrColor});
    if(R){bars(g4,'Все заказы, шт',R.ord,fOrd,{...CO,min:1.7,tone:'clay'});
      bars(g5,'Сумма заказов, ₽',R.rev,fRub,{...CO,tone:'clay'});
      bars(g6,'ДРР от всех заказов, %',R.ord.map((_,i)=>R.spend[i]&&!R.rev[i]?Infinity:div(R.spend[i],R.rev[i])),fDrr,{...CO,ref:TARGET,cap:0.3,color:drrColor});}
  });
  L.scrollLeft=0;syncHs();
}
function syncHs(){const L=document.getElementById('list'),th=document.getElementById('hth');const w=L.scrollWidth||1;th.style.width=Math.min(100,L.clientWidth/w*100)+'%';th.style.left=(L.scrollLeft/w*100)+'%'}
document.getElementById('list').addEventListener('scroll',syncHs);
document.getElementById('hl').onclick=()=>document.getElementById('list').scrollBy({left:-520,behavior:'smooth'});
document.getElementById('hr').onclick=()=>document.getElementById('list').scrollBy({left:520,behavior:'smooth'});
document.getElementById('htr').onclick=e=>{const L=document.getElementById('list'),r=e.currentTarget.getBoundingClientRect();L.scrollTo({left:(e.clientX-r.left)/r.width*L.scrollWidth-L.clientWidth/2,behavior:'smooth'})};
window.addEventListener('resize',syncHs);
const subjSel=document.getElementById('subj');
function fillSubj(){const cur=F.subj;subjSel.innerHTML='<option value="">Все</option>'+[...new Set(SC.map(a=>a.subject))].sort().map(v=>`<option${v===cur?' selected':''}>${v}</option>`).join('');if(!SC.some(a=>a.subject===cur))F.subj=''}
fillSubj();
const mgrSel=document.getElementById('mgr');mgrSel.innerHTML='<option value="">Все артикулы</option>';(DATA.managers||[]).forEach(m=>mgrSel.insertAdjacentHTML('beforeend',`<option>${m}</option>`));
if(!(DATA.managers||[]).length)mgrSel.parentElement.hidden=true;
mgrSel.onchange=e=>{MGR=e.target.value;recompute();fillSubj();renderAll();renderCamp();renderAssoc();renderLog();document.getElementById('h1').textContent=DATA.cabinet+(MGR?' · '+MGR:'')};
document.querySelectorAll('.chip[data-f]').forEach(b=>b.onclick=()=>{F[b.dataset.f]=b.dataset.v;document.querySelectorAll(`.chip[data-f="${b.dataset.f}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));renderCamp()});
subjSel.onchange=e=>{F.subj=e.target.value;renderCamp()};
document.getElementById('minsp').onchange=e=>{F.minsp=+e.target.value;renderCamp()};
document.getElementById('multi').onchange=e=>{F.multi=e.target.checked;renderCamp()};
document.getElementById('q').oninput=e=>{F.q=e.target.value.trim().toLowerCase();renderCamp()};
function tab(which){
  ['all','camp','assoc','log'].forEach(k=>{
    document.getElementById('p-'+k).hidden=k!==which;
    document.getElementById('t-'+k).setAttribute('aria-selected',k===which);
  });
  if(which==='camp')syncHs();}
document.getElementById('t-all').onclick=()=>tab('all');document.getElementById('t-camp').onclick=()=>tab('camp');
document.getElementById('t-assoc').onclick=()=>tab('assoc');document.getElementById('t-log').onclick=()=>tab('log');
document.getElementById('h1').textContent=DATA.cabinet;
document.getElementById('foot').innerHTML=`Источник: выгрузка РНП «RNPAdv_WB» за ${DAYS[0].lbl}–${DAYS.at(-1).lbl}.2026, кабинет ${DATA.cabinet}. ДРР = расход / сумма заказов с рекламы. Маржи в выгрузке нет — ориентир ДРР 5%, цель — рост заказов. Кампании без расхода за период не показаны.${HAS_AS?' ДРР — по всем заказам с рекламы (прямые + ассоциированные), как в кабинете WB.':' <b>В выгрузке нет ассоциированных заказов — ДРР выше, чем в кабинете WB.</b>'}`;
const root=document.documentElement;
document.getElementById('theme').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;root.dataset.theme=dark?'light':'dark'};
renderAll();renderCamp();renderAssoc();renderLog();
if(keepMgr&&(DATA.managers||[]).includes(keepMgr)){mgrSel.value=keepMgr;mgrSel.onchange({target:mgrSel})}
else if(location.hash.includes('mgr')&&(DATA.managers||[]).length){mgrSel.value=DATA.managers[0];mgrSel.onchange({target:mgrSel})}
if(location.hash.startsWith('#camp')){const m=+location.hash.slice(5);if(m){F.minsp=m;document.getElementById('minsp').value=String(m);renderCamp()}tab('camp')}
}
// === period picker: presets + built weeks + two-click calendar (Metric-Labs style) ===
const wkKeys=Object.keys(WEEKS).sort();
const pper=document.getElementById('pper'),pperBtn=document.getElementById('pperBtn'),pperLbl=document.getElementById('pperLbl'),
      ppop=document.getElementById('ppop'),pcal=document.getElementById('pcal'),pcalTitle=document.getElementById('pcalTitle'),
      pcalHint=document.getElementById('pcalHint'),pwks=document.getElementById('pwks');
const ALLD=[...new Set(wkKeys.flatMap(k=>WEEKS[k].days))].sort(),DLO=ALLD[0],DHI=ALLD[ALLD.length-1];
const wkStarts=new Set(wkKeys.map(k=>WEEKS[k].days[0]));
const fdt2=d=>d.slice(8,10)+'.'+d.slice(5,7);
let CURA=WEEKS[wkKeys.at(-1)].days[0],CURB=WEEKS[wkKeys.at(-1)].days[WEEKS[wkKeys.at(-1)].days.length-1];
let calM=new Date(CURB+'T00:00:00');calM.setDate(1);
let pend=null;
const HINT0='Два клика: начало и конец периода. Зелёная точка — начало готовой недели.';
function setTrig(){
  pperLbl.textContent=fdt2(CURA)+' – '+fdt2(CURB)+'.'+CURB.slice(2,4);
  document.querySelectorAll('.pq[data-w]').forEach(b=>{const w=WEEKS[b.dataset.w];b.classList.toggle('on',CURA===w.days[0]&&CURB===w.days[w.days.length-1])});
  document.querySelectorAll('.pq[data-q]').forEach(b=>b.classList.toggle('on',CURB===DHI&&CURA===dshift(DHI,-(+b.dataset.q-1))));
  const pa=document.querySelector('.pq[data-all]');if(pa)pa.classList.toggle('on',CURA===DLO&&CURB===DHI);
}
function closePop(){ppop.hidden=true;pend=null;pcalHint.textContent=HINT0;drawCal()}
function applyPeriod(a,b){
  if(b<a){const t=a;a=b;b=t}
  if(a<DLO)a=DLO;if(b>DHI)b=DHI;
  if(b<a)return;
  const V=buildPeriod(a,b);if(!V)return;
  CURA=V.days[0];CURB=V.days[V.days.length-1];
  setTrig();closePop();
  boot(V,document.getElementById('mgr').value);
}
function drawCal(){
  const y=calM.getFullYear(),m=calM.getMonth();
  pcalTitle.textContent=calM.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  let h=['пн','вт','ср','чт','пт','сб','вс'].map(x=>`<span class="wd">${x}</span>`).join('');
  for(let i=0;i<lead;i++)h+='<span></span>';
  for(let d=1;d<=dim;d++){
    const iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const ok=iso>=DLO&&iso<=DHI;
    let cls='';
    if(pend&&iso===pend)cls='pend';
    else if(!pend&&iso>=CURA&&iso<=CURB)cls='inr';
    if(!pend&&(iso===CURA||iso===CURB))cls+=' edge';
    if(ok&&wkStarts.has(iso))cls+=' wkd';
    h+=`<button type="button" class="${cls.trim()}" data-d="${iso}"${ok?'':' disabled'}>${d}</button>`;
  }
  pcal.innerHTML=h;
  pcal.querySelectorAll('button[data-d]:not(:disabled)').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    const d=b.dataset.d;
    if(!pend){pend=d;pcalHint.textContent='Начало: '+fdt2(d)+' · выберите конец периода';drawCal();return}
    applyPeriod(pend,d);
  });
}
pperBtn.onclick=e=>{e.stopPropagation();ppop.hidden=!ppop.hidden;if(!ppop.hidden)drawCal()};
document.addEventListener('click',e=>{if(!ppop.hidden&&!pper.contains(e.target))closePop()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ppop.hidden)closePop()});
document.getElementById('pcalPrev').onclick=e=>{e.stopPropagation();const t=new Date(calM);t.setMonth(t.getMonth()-1);const lo=new Date(DLO+'T00:00:00');lo.setDate(1);if(t>=lo){calM=t;drawCal()}};
document.getElementById('pcalNext').onclick=e=>{e.stopPropagation();const t=new Date(calM);t.setMonth(t.getMonth()+1);const hi=new Date(DHI+'T00:00:00');hi.setDate(1);if(t<=hi){calM=t;drawCal()}};
pwks.innerHTML=wkKeys.slice().reverse().map(k=>`<button type="button" class="pq" data-w="${k}">${WEEKS[k].label}</button>`).join('');
document.querySelectorAll('.pq[data-q]').forEach(b=>b.onclick=()=>applyPeriod(dshift(DHI,-(+b.dataset.q-1)),DHI));
{const pa=document.querySelector('.pq[data-all]');if(pa)pa.onclick=()=>applyPeriod(DLO,DHI)}
pwks.querySelectorAll('.pq[data-w]').forEach(b=>b.onclick=()=>{const w=WEEKS[b.dataset.w];applyPeriod(w.days[0],w.days[w.days.length-1])});
setTrig();
boot(buildPeriod(CURA,CURB));
</script>
<script>window.addEventListener('message',function(e){if(e.data&&e.data.type==='ctrleads-theme'){document.documentElement.dataset.theme=e.data.mode;try{renderAll();renderCamp();renderAssoc();renderLog();}catch(_){}}});</script></body>
